name: APK olustur
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: www klasorunu hazirla
        run: |
          ls -la
          if [ -f index.html ]; then
            mkdir -p www && cp index.html www/index.html
            echo "Kokteki index.html www klasorune kopyalandi"
          elif [ -f www/index.html ]; then
            echo "www/index.html kullaniliyor"
          else
            echo "HATA: index.html bulunamadi. Depodaki dosyalar:"
            find . -path ./.git -prune -o -type f -print
            exit 1
          fi
          if [ -f logo.png ]; then mkdir -p www && cp logo.png www/logo.png; fi
      - run: npm install
      - run: npx cap add android
      - name: Ikonlari olustur
        run: |
          if [ -f icon-only.png ]; then mkdir -p assets && cp icon-only.png icon-foreground.png assets/; fi
          if [ -f assets/icon-only.png ]; then
            npx --yes @capacitor/assets generate --android --iconBackgroundColor '#060503' --iconBackgroundColorDark '#060503'
          else
            echo "Ikon dosyalari yok, varsayilan simge kullanilacak"
          fi
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: muzik-calar-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

